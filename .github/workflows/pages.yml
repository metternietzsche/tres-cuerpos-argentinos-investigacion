name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate generated publication
        run: |
          npm run generate:routes
          git diff --exit-code -- web/static_prototype
          npm run test:static
          npm run test:unit
      - name: Browser acceptance matrix
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static_prototype
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Production smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          SITE_ROOT="${PAGE_URL%/}"
          curl --fail --location --retry 8 --retry-delay 5 "${SITE_ROOT}/"
          curl --fail --location --retry 8 --retry-delay 5 "${SITE_ROOT}/data/site_meta.json" | grep 'SITE_PUBLICATION_v0_6_6'
          curl --fail --location --retry 8 --retry-delay 5 "${SITE_ROOT}/laboratorio.html" | grep 'Analizá un discurso'
          curl --fail --location --retry 8 --retry-delay 5 "${SITE_ROOT}/orbital-analyzer.js" | grep 'OrbitalAnalyzer'
          curl --fail --location --retry 8 --retry-delay 5 "${SITE_ROOT}/leyendas.html" | grep 'Trazabilidad de Leyendas'
